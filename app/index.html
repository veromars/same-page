<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <!-- 앱은 이제 /app/ 아래에서 서빙된다. app.js·styles.css·images/ 등은
       리포 루트에 그대로 있으므로, 상대경로가 /app/ 이 아니라 루트 기준으로
       풀리도록 base 를 박아둔다. 이 한 줄이 없으면 이미지가 전부 404. -->
  <base href="/">
  <!-- 비공개 베타 — 검색 노출 차단. 공개 시 이 줄과 robots.txt 를 함께 푼다. -->

  <meta name="theme-color" content="#FAF9F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Same Page (p.2)</title>
  <meta name="description" content="같은 페이지를 찾는 공간">

  <meta property="og:locale" content="ko_KR">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

  <link href="https://fonts.googleapis.com/css2?family=Style+Script&amp;display=swap" rel="stylesheet">

       supabase-client.js)을 고칠 때마다 이 날짜를 네 군데 모두 올린다.
       빌드 단계가 없어서 파일명이 그대로라, 이게 없으면 브라우저가 예전 사본을
